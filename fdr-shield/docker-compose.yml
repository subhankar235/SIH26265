services:
  postgres:
    image: postgres:16
    environment:
      { POSTGRES_USER: fdr, POSTGRES_PASSWORD: fdr, POSTGRES_DB: fdrshield }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /minio/health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ \"$$status\" == *'200 OK'* ]]"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  mailhog:
    image: mailhog/mailhog
    ports: ["8025:8025"]
  mock-bank:
    build: ./backend/mock_bank_api
    ports: ["9100:9000"]
    volumes: ["./backend/mock_bank_api/data:/app/data:ro"]
  backend:
    build: ./backend
    env_file: ./backend/.env.example
    depends_on: [postgres, redis, minio, mock-bank]
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker -l info
    env_file: ./backend/.env.example
    depends_on: [backend]
    extra_hosts: ["host.docker.internal:host-gateway"]
  beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat -l info
    env_file: ./backend/.env.example
    depends_on: [backend]
  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
volumes:
  pgdata:
  minio-data:
